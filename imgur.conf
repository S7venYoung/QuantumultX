#!name = Imgur图片加载
#!desc = 将 Imgur 图片直链跳转到镜像站，缓解 429 问题
#!author = S7venYoung, revised for Quantumult X

[rewrite_local]

# 跳转 Imgur 图片链接到镜像站
^https?:\/\/(i\.)?imgur\.com\/.+\.(jpg|jpeg|png|gif|webp)(\?.*)?$ url script-response-header https://raw.githubusercontent.com/S7venYoung/QuantumultX/master/js/imgur-redirect.js

# 删除镜像站 Referer，避免被镜像站拦截
^https:\/\/img\.noobzone\.ru\/getimg\.php\?url=.* header-del Referer

[mitm]

hostname = imgur.com, i.imgur.com, img.noobzone.ru
